---
- name: this playbook installs the httpd
  hosts: all
  become: true
  tasks:
    - name: stop the service
      service:
         name: apache2
         state: stopped
      when: ansible_os_family == "Debian"

    - name: stop the service
      service:
        name: httpd
        state: stopped
      when: ansible_os_family == "RedHat"

    - name: uninstall package
      apt:
        name: apache2
        state: absent
      when: ansible_os_family == "Debian"

    - name: Uninstall package
      yum:
        name: httpd
        state: removed
      when: ansible_os_family == "RedHat"